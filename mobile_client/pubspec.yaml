name: mobile_client
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  
dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^2.0.0
  rust_lib_mobile_client:
    path: rust_builder
  flutter_rust_bridge: 2.13.0

  dio: ^5.11.0
  get_it: ^9.2.1
  go_router: ^18.1.2
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.3
  path: ^1.9.1
  timeago: ^3.7.1
  # url_launcher: ^6.3.2

  freezed_annotation: ^3.1.0

  intl: any
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  freezed: ^4.0.3
  build_runner: ^2.17.1

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  rename_app: ^1.6.6 
  # Command: `dart run rename_app:main all="new_name"`
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # web:
  #   generate: true
  # windows:
  #   generate: true
  # macos:
  #   generate: true
  #
  #
  # Command: `dart run flutter_launcher_icons`