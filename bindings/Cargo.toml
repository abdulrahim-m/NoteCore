[package]
name = "notecore_bindings"
version = "0.1.0"
edition = "2021"
description = "FFI bindings over the notecore engine: a plain DTO layer plus a flutter_rust_bridge v2 API"

[lib]
# cdylib   -> Android / Linux / Windows (.so / .dll)
# staticlib -> iOS / macOS (.a)
# rlib     -> lets `tests/` and other Rust crates link against it
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
notecore = { path = "../core" }

# Must match the installed `flutter_rust_bridge_codegen` version exactly.
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }

chrono = "0.4"

# Only needed to name `SqlitePool` and convert `sqlx::Error`.
# Keep the version compatible with the one used by `core`.
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
